[package]
name = "iota-sponsoring-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum-graphql = { path = "presentation/axum-graphql" }
composition-root = { path = "infrastructure/composition-root" }

dotenvy = "0.15"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace]
resolver = "2"
members = [
    "application",

    # Domain libraries
    "domain/balance-management",
    "domain/wallet-integration",

    # Infrastructure libraries
    "infrastructure/composition-root",

    # Presentation libraries
    "presentation/axum-graphql",
]
exclude = ["submodules/gas-station"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
cqrs-es = "0.4"
iota-gas-station = { path = "submodules/gas-station" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
